<!DOCTYPE html>

<head>

    <title>Confirmar Baja</title>
</head>
<body>

    <h1>Confirmar Baja de Cuenta</h1>

    <p>¿Estás seguro de que deseas dar de baja tu cuenta? Esta acción no se puede deshacer.</p>

    <form>
        <p>
            <label for="password">Introduce tu contraseña para confirmar:</label><br>
            <input type="password" id="password" name="password" required>
        </p>

        <button type="submit">Confirmar y Dar de Baja</button>
        
        <a href="perfil.html">
            <button type="button">Cancelar</button>
        </a>
    </form>

</body>
