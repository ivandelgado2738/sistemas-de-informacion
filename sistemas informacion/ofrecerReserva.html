<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofrecer Reserva</title>
</head>
<body>
  <h1>Ofrecer reserva de pistas</h1>

  <p>Datos sobre la pista</p>

  <form>
    <p>
      <label for="pista">Pista:</label><br>
      <select id="pista" name = "pista" required>
        <option value=""> --seleccione una pista-- </option>
        <option value = "pista1"> pista 1</option>
        <option value = "pista2"> pista 2</option>
        <option value = "pista3"> pista 3</option>
      </select>
    </p>

    <p>
      <label for="fecha"> Fecha: </label><br> 
      <input type = "date" id = "fecha" name = "fecha" required>
    </p>

    <p>
      <label for="horaInicio"> Hora Inicio</label><br>
      <input type = "time" id = "horaInicio" name = "horaInicio" required> 
    </p>

    <p>
      <label for="horaFin"> Hora Fin</label><br>
      <input type = "time" id = "horaFin" name = "horaFin" required> 
    </p>

    <p>
      <button type = "submit">Publicar Reserva</button>
      <a href = "verReservas.html">
        <button type = "button"> Cancelar </button>
      </a>
    </p>
  </form>
    
</body>
</html>
