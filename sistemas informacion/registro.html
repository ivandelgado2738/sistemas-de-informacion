<!DOCTYPE html lang="es">
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Registrar</title>
        <link rel="stylesheet" href="estilos-login.css">
    </head>
    <body>
        <div class="contenedor-login">
          <h2>Registro</h2>
          <form name = "Registro" action = "procesarForm.do" method = "post">
              <div class="input-group">
                    <label for="name">Nombre y Apellidos</label>
                    <input type="text" id="name" name="name" placeholder="Ingresa tu nombre completo" required>
              </div>
              <p>
              <div class="input-group">
                    <label for="username">Nombre Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu nuevo nombre de ususario" required>
              </div>
              <p>
              <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="text" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
              </div>
              <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="pass" name="pass" placeholder="Ingresa tu nueva contraseña" required>
              </div>
              <div class="input-group">
                    <label for="password">Confirma la contraseña</label>
                    <input type="password" id="confpass" name="confpass" placeholder="Confirma tu contraseña" required>
              </div>
              <button type="submit" class="btn-login">Registrarse</button>
              <p class="signup-link">
                    ¿Ya tienes cuenta? <a href="inicioSesion.html">Entra aquí</a>
              </p>
          </form>
        </div>
    </body>
</html>
