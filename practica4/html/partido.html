<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Información partido</title>
    <link rel="stylesheet" href="estilos-reserva.css">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-card">
            <div class="checkout-image-container">
                <img src="padel-court-3d-renderingpaddle-tennis-260nw-2093790160.webp" alt="Pista de Pádel" class="checkout-image">
            </div>
            <div class="checkout-content">
                <h2>Confirmar Reserva</h2>
                <div class="booking-info">
                    <p><strong>Club:</strong> Jugador 1</p>
                    <p><strong>Pista:</strong> Jugador 2</p>
                    <p><strong>Fecha:</strong> Jugador 3</p>
                </div>
                <form action="#" method="POST" class="booking-form">
                    <button type="submit" class="btn-checkout">Chat</button>
                    <a href="Main.html" class="btn-cancel">Volver</a>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
