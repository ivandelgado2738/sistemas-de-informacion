<!DOCTYPE html>
<html lang="es">
<head>

    <title>Registrar (Error)</title>
</head>
<body>

    <!-- MENSAJE DE ERROR EN ROJO -->

         Error: Campos inválidos o datos incompletos,Revisa el formulario.

    <form name="Registro" method="post">

        <p>
            Confirmar Contraseña:<br>
            <input type="password" name="Confirmar Contraseña"/>
        </p>

        <p>
            <a href="inicioSesion.html">

            </a>
